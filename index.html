<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f3f6f5">
    <title>PMUMS शिक्षक कल्याण कोष | शिवपुरी</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            color-scheme: light;
            --ink: #172d40;
            --muted: #687985;
            --green: #187b69;
            --green-dark: #116454;
            --line: #e4ebe8;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 32px 18px;
            display: grid;
            place-items: center;
            color: var(--ink);
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background:
                radial-gradient(ellipse at 12% 12%, rgba(205, 231, 220, 0.62), transparent 34%),
                radial-gradient(ellipse at 88% 90%, rgba(221, 231, 241, 0.7), transparent 32%),
                #f3f6f5;
        }

        .portal-card {
            width: min(100%, 560px);
            overflow: hidden;
            border: 1px solid rgba(222, 231, 227, 0.9);
            border-radius: 24px;
            background: #fff;
            box-shadow: 0 24px 70px rgba(27, 55, 69, 0.12);
        }

        .brand-header {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 24px 32px;
            color: #263547;
            background: #ff9933;
        }

        .brand-logo {
            width: 58px;
            height: 58px;
            flex: 0 0 auto;
            padding: 3px;
            border-radius: 50%;
            background: #fff;
            object-fit: cover;
        }

        .brand-title {
            margin: 0 0 4px;
            font-size: 1.05rem;
            font-weight: 700;
            line-height: 1.45;
        }

        .brand-caption {
            margin: 0;
            color: rgba(38, 53, 71, 0.82);
            font-size: 0.82rem;
        }

        .card-content {
            padding: 38px 42px 30px;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 14px;
            color: var(--green);
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .eyebrow::before {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #36a78c;
            content: "";
        }

        h1 {
            margin: 0;
            color: var(--ink);
            font-size: clamp(1.8rem, 6vw, 2.35rem);
            font-weight: 750;
            letter-spacing: -0.04em;
        }

        .intro {
            margin: 12px 0 30px;
            color: var(--muted);
            font-size: 1rem;
            line-height: 1.7;
        }

        .form-label {
            margin-bottom: 10px;
            color: #344b59;
            font-size: 0.94rem;
            font-weight: 700;
        }

        .form-select {
            min-height: 58px;
            padding: 0.8rem 3rem 0.8rem 1rem;
            border: 1px solid #dce5e1;
            border-radius: 12px;
            color: var(--ink);
            font-size: 1rem;
            box-shadow: none;
        }

        .form-select:focus {
            border-color: #54a895;
            box-shadow: 0 0 0 4px rgba(24, 123, 105, 0.12);
        }

        .block-actions {
            display: flex;
            gap: 12px;
        }

        .block-actions .form-select {
            min-width: 0;
            flex: 1;
        }

        .open-button {
            min-height: 58px;
            flex: 0 0 auto;
            padding: 0 18px;
            border: 0;
            border-radius: 12px;
            color: #fff;
            background: var(--green);
            font-size: 1rem;
            font-weight: 700;
            white-space: nowrap;
            transition: background-color 160ms ease, transform 160ms ease, box-shadow 160ms ease;
        }

        .open-button:hover {
            color: #fff;
            background: var(--green-dark);
            box-shadow: 0 8px 18px rgba(24, 123, 105, 0.2);
            transform: translateY(-1px);
        }

        .open-button:focus-visible {
            outline: 3px solid rgba(24, 123, 105, 0.35);
            outline-offset: 3px;
        }

        .card-footer {
            padding: 18px 24px;
            border-top: 1px solid var(--line);
            color: var(--muted);
            background: #fbfcfc;
            font-size: 0.88rem;
            font-weight: 600;
            text-align: center;
        }

        .team-footer-box {
            width: 100%;
            margin: 0;
            overflow: hidden;
            background: var(--green);
            text-align: center;
        }

        .team-footer-title {
            margin: 0;
            padding: 10px 16px;
            color: #fff;
            background: var(--green-dark);
            font-size: 0.9rem;
            font-weight: 700;
        }

        .team-footer-credit {
            margin: 0;
            padding: 9px 16px;
            color: #fff;
            font-size: 0.82rem;
        }

        @media (max-width: 480px) {
            body {
                padding: 18px 14px;
            }

            .portal-card {
                border-radius: 20px;
            }

            .brand-header {
                gap: 12px;
                padding: 20px;
            }

            .brand-logo {
                width: 50px;
                height: 50px;
            }

            .brand-title {
                font-size: 0.94rem;
            }

            .card-content {
                padding: 30px 24px 26px;
            }

            .block-actions {
                flex-direction: column;
            }

            .open-button {
                width: 100%;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <main class="portal-card">
        <header class="brand-header">
            <img src="logo.png" alt="PMUMS शिक्षक संघ का लोगो" class="brand-logo">
            <div>
                <p class="brand-title">PMUMS शिक्षक कल्याण कोष मप्र</p>
                <p class="brand-caption">शिक्षक संघ शिवपुरी, मध्यप्रदेश</p>
            </div>
        </header>

        <section class="card-content">
            <div class="eyebrow">शिवपुरी जिला पोर्टल</div>
            <h1>PMUMS Application</h1>

            <div>
                <label for="blockSelect" class="form-label">ब्लॉक का चयन करें</label>
                <div class="block-actions">
                    <select id="blockSelect" class="form-select" aria-label="ब्लॉक का चयन करें">
                        <option value="https://docs.google.com/spreadsheets/d/1Ml8_sLx9szmRnhIUfO_6HOg0fnfrjiY6zY8OMBmPseM/edit?usp=drivesdk">Shivpuri</option>
                        <option value="https://docs.google.com/spreadsheets/d/1yxSWY70zZjPTexbIcrbXLJ0Hvx_putZJS1fngUJ9q5w/edit?usp=drivesdk">Kolaras</option>
                        <option value="https://docs.google.com/spreadsheets/d/1xlsziUezR7POxDV6HE3k1350KpbOqDXsOE4yxuA_Rqc/edit?usp=drivesdk">Badarwas</option>
                        <option value="https://docs.google.com/spreadsheets/d/1yF7Z4cm7Ay6EHU9JH1U5Qiljb1ZNM9hp-PsmLlPtpSc/edit?usp=drivesdk">Karaira</option>
                        <option value="https://docs.google.com/spreadsheets/d/1jccTaBmbZRjwwpdt_pYYj41iKq-WtGQigVEcFyi0UVs/edit?usp=drivesdk">Khaniyadhana</option>
                        <option value="https://docs.google.com/spreadsheets/d/1o2b5PEnTUvCImpsxdpwFbbvqVfgM9lg1EcP5y4Oofx8/edit?usp=drivesdk">Pohri</option>
                        <option value="https://docs.google.com/spreadsheets/d/1Uw9Yss76Y4ud-UazKj1-jUzMpb9uAZGeWOhw2hMU_wU/edit?usp=drivesdk">Narvar</option>
                        <option value="https://docs.google.com/spreadsheets/d/1A_OOwntxsX9D62TtGV3eiTHs_LLRcP1i4iKC5qmpY4k/edit?usp=drivesdk">Pichhore</option>
                    </select>
                    <button type="button" onclick="openBlockSheet()" class="btn open-button">
                        ब्लॉक की जानकारी देखें <span aria-hidden="true">↗</span>
                    </button>
                </div>
            </div>
        </section>
<div class="team-footer-box">
    <footer class="team-footer-title">PMUMS Team, Shivpuri</footer>
    <p class="team-footer-credit">Made By : Sanjay Jain, IT Cell, Shivpuri, 8878543227</p>
</div>

    </main>

    <script>
        function openBlockSheet() {
            var selectBox = document.getElementById("blockSelect");
            var selectedUrl = selectBox.value;
            if (selectedUrl) {
                window.open(selectedUrl, "_blank", "noopener,noreferrer");
            }
        }
    </script>
</body>
</html>
